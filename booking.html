<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Записаться на экскурсию</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#707579);--button:var(--tg-theme-button-color,#2481cc);--button-text:var(--tg-theme-button-text-color,#fff);--secondary:var(--tg-theme-secondary-bg-color,#f1f1f1);--link:var(--tg-theme-link-color,#2481cc);--danger:#d33b32;--border:rgba(127,127,127,.25)}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}body{padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}.container{width:min(100%,680px);margin:auto}.section{margin-bottom:22px}h1{margin:0 0 16px;font-size:clamp(21px,5vw,27px);line-height:1.2}h2{margin:0 0 14px;font-size:clamp(17px,4.3vw,20px)}.excursion{background:var(--secondary);border-radius:14px;padding:15px;overflow-wrap:anywhere;font-weight:600}.form-row{margin-bottom:16px}.form-row label{display:block;margin-bottom:7px;font-weight:600}.required{color:var(--danger)}input[type=text],input[type=tel],input[type=email]{width:100%;min-height:48px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--secondary);color:var(--text);font:inherit;outline:none}input:focus{border-color:var(--button)}input.invalid{border-color:var(--danger)}.field-error{display:none;margin-top:5px;color:var(--danger);font-size:13px}.field-error.visible{display:block}.counter{display:grid;grid-template-columns:52px 80px 52px;align-items:center;gap:8px}.counter button{width:52px;min-height:48px;border:0;border-radius:12px;background:var(--secondary);color:var(--text);font:inherit;font-size:25px;cursor:pointer}.counter button:disabled{opacity:.4;cursor:not-allowed}.counter-value{min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--secondary);font-size:18px;font-weight:700}.limits{margin-top:6px;color:var(--hint);font-size:13px}.total{margin-top:8px;padding:15px;border-radius:14px;background:var(--secondary);font-size:18px;font-weight:700}.amount{font-size:21px}.check-row{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--border);cursor:pointer}.check-row input{position:absolute;opacity:0;pointer-events:none}.box{flex:0 0 25px;width:25px;height:25px;border:2px solid var(--hint);border-radius:6px;display:grid;place-items:center;margin-top:1px}.check-row input:checked+.box{background:var(--button);border-color:var(--button)}.check-row input:checked+.box::after{content:"✓";color:var(--button-text);font-size:17px;font-weight:800}.check-content{flex:1;min-width:0}.check-title{font-weight:600}.legal-link{color:var(--link);text-decoration:none}.legal-link:hover{text-decoration:underline}.error-summary{display:none;margin-top:12px;color:var(--danger);font-size:14px}.error-summary.visible{display:block}.actions{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:24px}button.action{width:100%;min-height:50px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}.cancel{background:var(--secondary);color:var(--text)}.pay{background:var(--button);color:var(--button-text)}.pay:disabled{opacity:.45;cursor:not-allowed}.loading{display:none;margin-top:10px;color:var(--hint);text-align:center;font-size:14px}.loading.visible{display:block}
</style>
</head>
<body>
<main class="container">
<section class="section">
<h1>Записаться на экскурсию:</h1>
<div class="excursion" id="excursionData">Загрузка...</div>
</section>
<section class="section">
<h2>Введите Ваши контактные данные:</h2>
<div class="form-row"><label for="clientsName">Имя и Фамилия <span class="required">*</span></label><input id="clientsName" type="text" autocomplete="name" placeholder="Введите имя и фамилию" maxlength="100"><div class="field-error" id="nameError">Введите имя и фамилию: минимум два слова.</div></div>
<div class="form-row"><label for="clientsTelephoneNumber">Телефон для связи <span class="required">*</span></label><input id="clientsTelephoneNumber" type="tel" autocomplete="tel" placeholder="+49..." maxlength="25"><div class="field-error" id="phoneError">Введите корректный номер телефона.</div></div>
<div class="form-row"><label for="clientsEmail">EMail <span class="required">*</span></label><input id="clientsEmail" type="email" autocomplete="email" placeholder="example@email.com" maxlength="150"><div class="field-error" id="emailError">Введите корректный EMail.</div></div>
<div class="form-row"><label>Количество мест:</label><div class="counter"><button type="button" id="minusButton" aria-label="Уменьшить">−</button><div class="counter-value" id="personsValue">1</div><button type="button" id="plusButton" aria-label="Увеличить">+</button></div><div class="limits" id="personsLimits"></div></div>
<div class="total">Сумма к оплате: <span id="calculation">1 × 0 =</span> <span class="amount" id="amountToPay">0</span> <span id="currency">руб.</span></div>
</section>
<section class="section">
<label class="check-row"><input type="checkbox" id="privacy"><span class="box" aria-hidden="true"></span><span class="check-content"><span class="check-title">Я соглашаюсь с условиями <a class="legal-link" href="https://salebot.pro/terms" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">Политика конфиденциальности</a></span></span></label>
<label class="check-row"><input type="checkbox" id="personalData"><span class="box" aria-hidden="true"></span><span class="check-content"><span class="check-title">Я согласен на обработку <a class="legal-link" href="https://salebot.pro/policy_ooo.pdf" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();">Персональных данных</a></span></span></label>
<div class="error-summary" id="errorSummary">Проверьте заполнение формы и подтвердите оба согласия.</div>
<div class="loading" id="loading">Передача данных...</div>
<div class="actions"><button class="action cancel" id="cancelButton" type="button">Отменить</button><button class="action pay" id="payButton" type="button" disabled>Оплатить</button></div>
</section>
</main>
<script>
(function(){
const tg=window.Telegram&&window.Telegram.WebApp?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('secondary_bg_color');if(tg.setBackgroundColor)tg.setBackgroundColor('bg_color')}
const params=new URLSearchParams(location.search);
const excursionData=params.get('Excursion_Data')||'';
const bookPrice=parseNumber(params.get('Book_Price')||'0');
const maxPersons=Math.max(1,Math.floor(parseNumber(params.get('Max_Persons')||'1')));
let selectedPersons=Math.floor(parseNumber(params.get('Selected_Persons')||'1'));selectedPersons=Math.min(Math.max(selectedPersons,1),maxPersons);
const currency=params.get('Currency')||'руб.';
const $=id=>document.getElementById(id);
$('excursionData').textContent=excursionData||'Экскурсия не указана';$('currency').textContent=currency;$('personsLimits').textContent='Доступно мест: '+maxPersons;
function parseNumber(v){v=String(v).replace(/\s/g,'').replace(',','.');const n=Number(v);return Number.isFinite(n)?n:0}
function formatNumber(v){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(v)}
function updatePersons(){$('personsValue').textContent=selectedPersons;$('minusButton').disabled=selectedPersons<=1;$('plusButton').disabled=selectedPersons>=maxPersons;const total=selectedPersons*bookPrice;$('calculation').textContent=selectedPersons+' × '+formatNumber(bookPrice)+' =';$('amountToPay').textContent=formatNumber(total)}
function validateName(show){const el=$('clientsName'),v=el.value.trim().replace(/\s+/g,' '),ok=/^[A-Za-zА-Яа-яЁё]+(?:-[A-Za-zА-Яа-яЁё]+)*(?: [A-Za-zА-Яа-яЁё]+(?:-[A-Za-zА-Яа-яЁё]+)*)+$/.test(v);if(show){$('nameError').classList.toggle('visible',!ok);el.classList.toggle('invalid',!ok)}return ok}
function validatePhone(show){const el=$('clientsTelephoneNumber'),v=el.value.trim(),digits=v.replace(/\D/g,''),ok=/^[+()\d\s-]+$/.test(v)&&digits.length>=7&&digits.length<=15;if(show){$('phoneError').classList.toggle('visible',!ok);el.classList.toggle('invalid',!ok)}return ok}
function validateEmail(show){const el=$('clientsEmail'),v=el.value.trim(),ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);if(show){$('emailError').classList.toggle('visible',!ok);el.classList.toggle('invalid',!ok)}return ok}
function updateState(){$('payButton').disabled=!(validateName(false)&&validatePhone(false)&&validateEmail(false)&&$('privacy').checked&&$('personalData').checked&&selectedPersons>=1&&selectedPersons<=maxPersons)}
$('minusButton').addEventListener('click',()=>{if(selectedPersons>1){selectedPersons--;updatePersons();updateState()}});$('plusButton').addEventListener('click',()=>{if(selectedPersons<maxPersons){selectedPersons++;updatePersons();updateState()}});
['clientsName','clientsTelephoneNumber','clientsEmail'].forEach(id=>$(id).addEventListener('input',updateState));$('clientsName').addEventListener('blur',()=>{validateName(true);updateState()});$('clientsTelephoneNumber').addEventListener('blur',()=>{validatePhone(true);updateState()});$('clientsEmail').addEventListener('blur',()=>{validateEmail(true);updateState()});$('privacy').addEventListener('change',updateState);$('personalData').addEventListener('change',updateState);
$('cancelButton').addEventListener('click',()=>{if(tg&&typeof tg.close==='function')tg.close();else alert('Тестовый режим: форма отменена.')});
$('payButton').addEventListener('click',()=>{const ok=validateName(true)&&validatePhone(true)&&validateEmail(true)&&$('privacy').checked&&$('personalData').checked;if(!ok){$('errorSummary').classList.add('visible');updateState();return}const payload={action:'pay',clientsName:$('clientsName').value.trim().replace(/\s+/g,' '),clientsTelephoneNumber:$('clientsTelephoneNumber').value.trim(),clientsEmail:$('clientsEmail').value.trim(),Selected_Persons:selectedPersons,Book_Price:bookPrice,Amount_to_Pay:selectedPersons*bookPrice,privacy_accepted:$('privacy').checked?1:0,personal_data_accepted:$('personalData').checked?1:0,timestamp:new Date().toISOString()};$('loading').classList.add('visible');$('payButton').disabled=true;if(tg&&typeof tg.sendData==='function')tg.sendData(JSON.stringify(payload));else{console.log(payload);alert('Тестовый режим:\n\n'+JSON.stringify(payload,null,2));$('loading').classList.remove('visible');updateState()}});
updatePersons();updateState();
})();
</script>
</body>
</html>
